    const el = document.getElementById('status');
    if(el) el.innerHTML = '<div style="color:#ff8080; text-align:center;">Decryption failed.<br>' + (e && e.message ? e.message : e) + '</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
